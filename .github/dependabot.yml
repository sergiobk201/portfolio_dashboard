# Monthly, grouped update PRs. Runtime pins in prices_requirements.txt move only
# through a reviewed PR: the tests.yml gate runs on every one, because a silent
# change in a data library is a silent change in reported returns.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Pinned to the last releases for the pipelines' Python 3.10 (numpy per Python
      # version in requirements.txt). A minor or major bump drops 3.10 and would turn
      # every grouped PR red: move them together with a deliberate Python upgrade.
      - dependency-name: numpy
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: pandas
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
