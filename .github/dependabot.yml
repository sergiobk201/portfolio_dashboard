# Monthly, grouped update PRs. Runtime pins in prices_requirements.txt move only
# through a reviewed PR: the tests.yml gate runs on every one, because a silent
# change in a data library is a silent change in reported returns.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
