name: Daily SP500 Price Fetch

on:
  schedule:
    - cron: "0 15 * * 2-6"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r prices_requirements.txt

      - name: Run pipeline
        env:
          host: ${{ secrets.DB_HOST }}
          dbname: ${{ secrets.DB_NAME }}
          user: ${{ secrets.DB_USER }}
          password: ${{ secrets.DB_PASSWORD }}
          port: ${{ secrets.DB_PORT }}
          BRAPI_KEY: ${{ secrets.BRAPI_KEY }}
          PORT_BOT_TOKEN: ${{ secrets.PORT_BOT_TOKEN }}
          PORT_BOT_CHAT: ${{ secrets.PORT_BOT_CHAT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python pipelines/spy_pipeline.py
