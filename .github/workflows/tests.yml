name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            prices_requirements.txt
            requirements-dev.txt
            requirements.txt
      # Pipeline + dashboard stacks: the AppTest smoke tests need Streamlit
      # (the daily gate installs only the pipeline stack and skips them).
      - run: pip install -r requirements-dev.txt -r requirements.txt
      # Syntax gate for code the tests do not import (the Streamlit app, tools/).
      - run: python -m compileall -q pipelines tools public_app.py
      - run: python -m pytest

  dashboard-cloud:
    # Mirrors Streamlit Community Cloud: Python 3.14 and requirements.txt alone.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # pytest at the requirements-dev.txt pin (that file also pulls the 3.10 pipeline stack).
      - run: pip install -r requirements.txt "$(grep -E '^pytest==' requirements-dev.txt)"
      - run: python -m pytest tests/test_dashboard_metrics.py tests/test_public_app.py
